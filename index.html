<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAMAC Lagoons — Owner Directory Map</title>
<style>
  :root{
    --navy:#132a42;
    --navy-2:#1c3a5c;
    --sand:#f6f2ea;
    --sand-2:#efe8d8;
    --gold:#b98a3e;
    --gold-light:#e4c98a;
    --ink:#1c2530;
    --muted:#6b7686;
    --line:#e1d9c6;
    --white:#ffffff;
    --danger:#a13d3d;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sand);overflow:hidden;}

  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:14px;
    background:var(--navy);color:var(--white);
    padding:10px 18px;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:50;
  }
  #topbar .brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px;}
  #topbar .brand b{font-size:16px;letter-spacing:.3px;}
  #topbar .brand span{font-size:11px;color:var(--gold-light);letter-spacing:.5px;}

  #searchWrap{position:relative;flex:1;max-width:420px;}
  #searchBox{
    width:100%;padding:9px 14px 9px 36px;border-radius:8px;border:1px solid transparent;
    background:rgba(255,255,255,.12);color:var(--white);font-size:14px;outline:none;
  }
  #searchBox::placeholder{color:#c8d2de;}
  #searchBox:focus{background:rgba(255,255,255,.2);}
  #searchIcon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7;font-size:14px;pointer-events:none;}
  #searchResults{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--white);
    border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:360px;overflow-y:auto;
    display:none;z-index:60;color:var(--ink);
  }
  #searchResults.show{display:block;}
  .sr-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--sand-2);font-size:13.5px;}
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--sand);}
  .sr-villa{font-weight:700;color:var(--navy-2);margin-right:8px;}
  .sr-owner{color:var(--muted);}
  .sr-empty{padding:14px;color:var(--muted);font-size:13px;}

  select#clusterFilter{
    background:rgba(255,255,255,.12);color:var(--white);border:none;border-radius:8px;
    padding:9px 10px;font-size:13.5px;outline:none;
  }
  select#clusterFilter option{color:var(--ink);}

  .toggle-group{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;gap:2px;}
  .toggle-group button{
    border:none;background:transparent;color:#c8d2de;padding:7px 14px;border-radius:6px;
    font-size:13.5px;cursor:pointer;font-weight:600;
  }
  .toggle-group button.active{background:var(--gold);color:var(--navy);}

  #stats{font-size:12px;color:#c8d2de;white-space:nowrap;margin-left:auto;padding-right:4px;}

  /* ---------- Main area ---------- */
  #main{flex:1;position:relative;overflow:hidden;background:#dfe6ea;}

  #mapViewport{position:absolute;inset:0;overflow:hidden;cursor:grab;}
  #mapViewport.grabbing{cursor:grabbing;}
  #mapWorld{position:absolute;top:0;left:0;transform-origin:0 0;}
  #mapImg{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}

  .marker{
    position:absolute;width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);cursor:pointer;
    border:1.2px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }
  .marker:hover{width:14px;height:14px;z-index:5;}
  .marker.selected{width:16px;height:16px;box-shadow:0 0 0 3px rgba(185,138,62,.55);z-index:6;}
  .marker.dim{opacity:.12;}

  /* zoom controls */
  #zoomCtl{position:absolute;right:16px;bottom:20px;display:flex;flex-direction:column;gap:6px;z-index:20;}
  #zoomCtl button{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--white);
    font-size:18px;cursor:pointer;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  #zoomCtl button:hover{background:var(--sand);}

  #legend{
    position:absolute;left:16px;bottom:20px;background:rgba(255,255,255,.95);border-radius:10px;
    padding:10px 12px;font-size:11.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:200px;
    z-index:20;
  }
  #legend .lg-title{font-weight:700;margin-bottom:6px;color:var(--navy-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
  #legend .lg-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  #legend .lg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  #hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(19,42,66,.85);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;
    z-index:20;pointer-events:none;transition:opacity .4s;
  }

  /* ---------- Detail panel ---------- */
  #panel{
    position:absolute;top:0;right:-380px;width:360px;height:100%;background:var(--white);
    box-shadow:-4px 0 20px rgba(0,0,0,.15);transition:right .25s ease;z-index:40;
    display:flex;flex-direction:column;
  }
  #panel.open{right:0;}
  #panel .p-head{
    background:var(--navy);color:var(--white);padding:18px 20px 16px;position:relative;
  }
  #panel .p-close{
    position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);border:none;color:#fff;
    width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;
  }
  #panel .p-villa{font-size:24px;font-weight:800;letter-spacing:.3px;}
  #panel .p-cluster{font-size:12.5px;color:var(--gold-light);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
  #panel .p-body{padding:18px 20px;overflow-y:auto;flex:1;}
  .owner-card{
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--sand);
  }
  .owner-card .o-name{font-weight:700;font-size:14.5px;margin-bottom:8px;color:var(--ink);}
  .phone-row{
    display:flex;flex-direction:column;gap:7px;background:var(--white);
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;font-size:13.5px;
  }
  .phone-row .ph-top{display:flex;align-items:center;}
  .phone-row .ph-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-right:8px;}
  .phone-row .ph-num{color:var(--ink);font-weight:600;letter-spacing:.2px;}
  .ph-actions{display:flex;gap:6px;}
  .pbtn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    border:none;border-radius:6px;padding:7px 8px;font-size:12px;font-weight:600;
    cursor:pointer;text-decoration:none;line-height:1;
  }
  .pbtn svg{width:13px;height:13px;flex-shrink:0;}
  .pbtn-call{background:var(--navy);color:#fff;}
  .pbtn-call:hover{background:var(--navy-2);}
  .pbtn-wa{background:#25d366;color:#fff;}
  .pbtn-wa:hover{background:#1fb955;}
  .pbtn-copy{background:var(--sand-2);color:var(--navy-2);}
  .pbtn-copy:hover{background:var(--gold-light);}
  .no-owner{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0;}
  #panel .p-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);}

  /* ---------- List view ---------- */
  #listView{position:absolute;inset:0;background:var(--white);overflow-y:auto;display:none;}
  #listView.show{display:block;}
  #listView table{width:100%;border-collapse:collapse;font-size:13.5px;}
  #listView thead{position:sticky;top:0;background:var(--sand);z-index:5;}
  #listView th{
    text-align:left;padding:10px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);border-bottom:2px solid var(--line);cursor:pointer;user-select:none;
  }
  #listView th:hover{color:var(--navy-2);}
  #listView td{padding:9px 16px;border-bottom:1px solid var(--sand-2);}
  #listView tr:hover td{background:var(--sand);}
  #listView tr{cursor:pointer;}
  .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--sand-2);color:var(--navy-2);}
  .multi-badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;}

  #listCount{padding:12px 16px;font-size:12px;color:var(--muted);}

  @media (max-width:720px){
    #topbar{flex-wrap:wrap;gap:8px;padding:8px 12px;}
    #topbar .brand{display:none;}
    #searchWrap{max-width:none;flex:1 1 100%;order:1;}
    select#clusterFilter{order:2;}
    .toggle-group{order:3;}
    #stats{display:none;}
    #panel{
      top:auto;left:0;right:0;bottom:0;width:100%;height:auto;max-height:75vh;
      border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);
      transform:translateY(100%);transition:transform .25s ease;
    }
    #panel.open{transform:translateY(0);right:0;}
    #panel .p-head{border-radius:16px 16px 0 0;padding-top:20px;}
    #panel .p-head::before{
      content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.4);
    }
    #legend{display:none;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><b>DAMAC LAGOONS</b><span>OWNER DIRECTORY MAP</span></div>

    <div id="searchWrap">
      <span id="searchIcon">&#128269;</span>
      <input id="searchBox" type="text" placeholder="Search villa number or owner name…" autocomplete="off">
      <div id="searchResults"></div>
    </div>

    <select id="clusterFilter">
      <option value="">All clusters</option>
    </select>

    <div class="toggle-group">
      <button id="btnMapView" class="active">Map</button>
      <button id="btnListView">List</button>
    </div>

    <div id="stats"></div>
  </div>

  <div id="main">

    <div id="mapViewport">
      <div id="mapWorld">
        <img id="mapImg" src="map.jpg" draggable="false">
        <div id="markerLayer"></div>
      </div>
    </div>

    <div id="hint">Scroll to zoom · Drag to pan · Click a unit</div>

    <div id="zoomCtl">
      <button id="zoomIn">+</button>
      <button id="zoomReset">&#8982;</button>
      <button id="zoomOut">–</button>
    </div>

    <div id="legend"></div>

    <div id="listView">
      <div id="listCount"></div>
      <table>
        <thead>
          <tr>
            <th data-k="v">Villa #</th>
            <th data-k="c">Cluster</th>
            <th data-k="oname">Owner(s)</th>
            <th data-k="ophone">Phone</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>

    <div id="panel">
      <div class="p-head">
        <button class="p-close" id="panelClose">&#10005;</button>
        <div class="p-villa" id="pVilla">—</div>
        <div class="p-cluster" id="pCluster">—</div>
      </div>
      <div class="p-body" id="pBody"></div>
      <div class="p-foot" id="pFoot"></div>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- palette ----------------
  var CLUSTER_COLORS = {
    "PORTOFINO":"#b98a3e", "SANTORINI":"#3f9c9c", "COSTA BRAVA":"#5a8f4f",
    "NICE":"#c9a15a", "VENICE":"#a1466b", "MALTA":"#a13d3d",
    "MARBELLA":"#2f6b4f", "MONTECARLO":"#7a5ca0", "MYKONOS":"#4f6f6a",
    "IBIZA":"#5fa77c", "MOROCCO":"#8a6d3b"
  };
  var CLUSTER_ORDER = ["SANTORINI","COSTA BRAVA","PORTOFINO","NICE","VENICE","MALTA",
                       "MARBELLA","MONTECARLO","MYKONOS","IBIZA","MOROCCO"];

  var IMG_W = 4000, IMG_H = 2829; // native pixel size of map.jpg

  var state = {
    units: null,          // id -> unit
    list: [],              // array of units with id
    scale: 1, minScale: .2, maxScale: 6,
    tx: 0, ty: 0,
    activeCluster: "",
    selectedId: null,
    view: "map"
  };

  var viewport = document.getElementById('mapViewport');
  var world = document.getElementById('mapWorld');
  var img = document.getElementById('mapImg');
  var markerLayer = document.getElementById('markerLayer');

  // ---------------- load data ----------------
  fetch('units.json').then(function(r){return r.json();}).then(function(data){
    state.units = data;
    state.list = Object.keys(data).map(function(id){
      var u = data[id]; u.id = id; return u;
    });
    init();
  });

  function init(){
    buildClusterFilter();
    buildLegend();
    renderMarkers();
    buildListView();
    updateStats();
    fitToScreen();
    requestAnimationFrame(function(){ fitToScreen(); });
    setTimeout(fitToScreen, 250);
    bindEvents();
    setTimeout(function(){
      var h = document.getElementById('hint');
      h.style.opacity = '0';
    }, 3200);
  }

  var CALL_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>';
  var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.1 14.9 3.7 13.5 3.7 12c0-4.6 3.7-8.3 8.3-8.3s8.3 3.7 8.3 8.3-3.7 8.2-8.3 8.2zm4.6-6.2c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.6.8-.8 1-.1.2-.3.2-.6.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 8.9 9.5 7.7 9.3 7.2c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.5-.3z"/></svg>';

  function toIntlDigits(raw){
    var digits = (raw||'').replace(/\D/g,'');
    if(!digits) return '';
    if(digits.charAt(0) === '0') digits = '971' + digits.slice(1); // local UAE format -> +971
    return digits;
  }

  function ownerNames(u){
    return u.o.map(function(o){return o.n||'';}).filter(Boolean).join(', ');
  }
  function ownerPhones(u){
    var out = [];
    u.o.forEach(function(o){
      if(o.m) out.push(o.m);
      if(o.s) out.push(o.s);
      if(o.x2) out = out.concat(o.x2);
    });
    return out;
  }

  // ---------------- markers ----------------
  function renderMarkers(){
    var frag = document.createDocumentFragment();
    state.list.forEach(function(u){
      var el = document.createElement('div');
      el.className = 'marker';
      el.style.left = u.x + '%';
      el.style.top = u.y + '%';
      el.style.background = CLUSTER_COLORS[u.c] || '#888';
      el.dataset.id = u.id;
      markerLayer.appendChild(el);
    });
  }

  markerLayer.addEventListener('click', function(e){
    var t = e.target;
    if(t.classList.contains('marker')){
      selectUnit(t.dataset.id, true);
    }
  });

  function applyClusterFilter(){
    var nodes = markerLayer.children;
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      var u = state.units[n.dataset.id];
      if(state.activeCluster && u.c !== state.activeCluster){
        n.classList.add('dim');
      } else {
        n.classList.remove('dim');
      }
    }
  }

  // ---------------- pan / zoom ----------------
  function applyTransform(){
    world.style.transform = 'translate('+state.tx+'px,'+state.ty+'px) scale('+state.scale+')';
  }

  function fitToScreen(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var s = Math.min(vw/IMG_W, vh/IMG_H) * 0.96;
    state.scale = s;
    state.tx = (vw - IMG_W*s)/2;
    state.ty = (vh - IMG_H*s)/2;
    applyTransform();
  }

  function zoomAt(clientX, clientY, factor){
    var rect = viewport.getBoundingClientRect();
    var mx = clientX - rect.left, my = clientY - rect.top;
    var newScale = Math.min(state.maxScale, Math.max(state.minScale, state.scale*factor));
    var ratio = newScale/state.scale;
    state.tx = mx - (mx - state.tx)*ratio;
    state.ty = my - (my - state.ty)*ratio;
    state.scale = newScale;
    applyTransform();
  }

  viewport.addEventListener('wheel', function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoomAt(e.clientX, e.clientY, factor);
  }, {passive:false});

  var dragging = false, lastX=0, lastY=0, moved=false;
  viewport.addEventListener('mousedown', function(e){
    dragging = true; moved=false; lastX=e.clientX; lastY=e.clientY;
    viewport.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    var dx = e.clientX-lastX, dy = e.clientY-lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved = true;
    state.tx += dx; state.ty += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', function(){
    dragging = false;
    viewport.classList.remove('grabbing');
  });

  // touch support (basic pan + pinch)
  var touchState = {};
  viewport.addEventListener('touchstart', function(e){
    if(e.touches.length===1){
      touchState.x = e.touches[0].clientX; touchState.y = e.touches[0].clientY;
      touchState.mode='pan';
    } else if(e.touches.length===2){
      touchState.mode='pinch';
      touchState.d0 = touchDist(e.touches);
      touchState.s0 = state.scale;
      touchState.cx = (e.touches[0].clientX+e.touches[1].clientX)/2;
      touchState.cy = (e.touches[0].clientY+e.touches[1].clientY)/2;
    }
  }, {passive:true});
  viewport.addEventListener('touchmove', function(e){
    if(touchState.mode==='pan' && e.touches.length===1){
      var dx = e.touches[0].clientX - touchState.x;
      var dy = e.touches[0].clientY - touchState.y;
      state.tx += dx; state.ty += dy;
      touchState.x = e.touches[0].clientX; touchState.y = e.touches[0].clientY;
      applyTransform();
    } else if(touchState.mode==='pinch' && e.touches.length===2){
      var d = touchDist(e.touches);
      var factor = d/touchState.d0;
      zoomAt(touchState.cx, touchState.cy, factor/(state.scale/touchState.s0));
    }
  }, {passive:true});
  function touchDist(t){
    var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  document.getElementById('zoomIn').onclick = function(){
    var r=viewport.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1.35);
  };
  document.getElementById('zoomOut').onclick = function(){
    var r=viewport.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.35);
  };
  document.getElementById('zoomReset').onclick = fitToScreen;

  window.addEventListener('resize', function(){
    if(state.view==='map') fitToScreen();
  });

  function focusUnit(u){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var targetScale = Math.max(state.scale, 2.2);
    state.scale = targetScale;
    var px = u.x/100*IMG_W, py = u.y/100*IMG_H;
    state.tx = vw/2 - px*targetScale;
    state.ty = vh/2 - py*targetScale;
    applyTransform();
  }

  // ---------------- selection / panel ----------------
  function selectUnit(id, doFocus){
    state.selectedId = id;
    var prev = markerLayer.querySelector('.marker.selected');
    if(prev) prev.classList.remove('selected');
    var el = markerLayer.querySelector('.marker[data-id="'+id+'"]');
    if(el) el.classList.add('selected');

    var u = state.units[id];
    if(!u) return;
    if(doFocus && state.view==='map') focusUnit(u);
    openPanel(u);
  }

  function openPanel(u){
    document.getElementById('pVilla').textContent = u.v;
    document.getElementById('pCluster').textContent = u.c;
    var body = document.getElementById('pBody');
    body.innerHTML = '';

    if(!u.o.length){
      body.innerHTML = '<div class="no-owner">No owner on file for this unit.</div>';
    } else {
      u.o.forEach(function(o){
        var card = document.createElement('div');
        card.className = 'owner-card';
        var html = '<div class="o-name">'+escapeHtml(o.n||'Unnamed owner')+'</div>';
        var phones = [];
        if(o.m) phones.push(['Mobile', o.m]);
        if(o.s) phones.push(['Secondary', o.s]);
        if(o.x2) o.x2.forEach(function(x){phones.push(['Additional', x]);});
        if(!phones.length){
          html += '<div class="no-owner" style="padding:2px 0;">No phone on file</div>';
        } else {
          phones.forEach(function(p){
            var num = p[1];
            var intl = toIntlDigits(num);
            html += '<div class="phone-row">'+
                    '<div class="ph-top"><span class="ph-label">'+p[0]+'</span><span class="ph-num">'+num+'</span></div>'+
                    '<div class="ph-actions">'+
                      (intl ? '<a class="pbtn pbtn-call" href="tel:+'+intl+'">'+CALL_ICON+'Call</a>' : '')+
                      (intl ? '<a class="pbtn pbtn-wa" href="https://wa.me/'+intl+'" target="_blank" rel="noopener">'+WA_ICON+'WhatsApp</a>' : '')+
                      '<button class="pbtn pbtn-copy" data-copy="'+num+'">Copy</button>'+
                    '</div></div>';
          });
        }
        card.innerHTML = html;
        body.appendChild(card);
      });
    }
    var foot = document.getElementById('pFoot');
    foot.textContent = u.o.length>1 ? (u.o.length+' owners on file for this unit') : '';

    document.getElementById('panel').classList.add('open');
  }

  document.getElementById('panelClose').onclick = function(){
    document.getElementById('panel').classList.remove('open');
  };

  document.getElementById('pBody').addEventListener('click', function(e){
    if(e.target.dataset && e.target.dataset.copy){
      var val = e.target.dataset.copy;
      navigator.clipboard && navigator.clipboard.writeText(val);
      var old = e.target.textContent;
      e.target.textContent = 'Copied';
      setTimeout(function(){e.target.textContent = old;}, 1200);
    }
  });

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- cluster filter & legend ----------------
  function buildClusterFilter(){
    var sel = document.getElementById('clusterFilter');
    var counts = {};
    state.list.forEach(function(u){ counts[u.c] = (counts[u.c]||0)+1; });
    CLUSTER_ORDER.forEach(function(c){
      if(!counts[c]) return;
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c+' ('+counts[c]+')';
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){
      state.activeCluster = sel.value;
      applyClusterFilter();
      renderListRows();
      updateStats();
    });
  }

  function buildLegend(){
    var el = document.getElementById('legend');
    var html = '<div class="lg-title">Clusters</div>';
    CLUSTER_ORDER.forEach(function(c){
      if(!CLUSTER_COLORS[c]) return;
      html += '<div class="lg-row"><span class="lg-dot" style="background:'+CLUSTER_COLORS[c]+'"></span>'+c+'</div>';
    });
    el.innerHTML = html;
  }

  function updateStats(){
    var total = state.list.length;
    var shown = state.activeCluster ? state.list.filter(function(u){return u.c===state.activeCluster;}).length : total;
    document.getElementById('stats').textContent = shown.toLocaleString()+' / '+total.toLocaleString()+' units';
  }

  // ---------------- search ----------------
  var searchBox = document.getElementById('searchBox');
  var searchResults = document.getElementById('searchResults');

  searchBox.addEventListener('input', function(){
    var q = searchBox.value.trim().toLowerCase();
    if(q.length < 1){ searchResults.classList.remove('show'); return; }
    var matches = state.list.filter(function(u){
      if(u.v.toLowerCase().indexOf(q)===0) return true;
      return ownerNames(u).toLowerCase().indexOf(q) !== -1;
    }).slice(0,40);
    renderSearchResults(matches, q);
  });

  function renderSearchResults(matches, q){
    if(!matches.length){
      searchResults.innerHTML = '<div class="sr-empty">No matches for "'+escapeHtml(q)+'"</div>';
      searchResults.classList.add('show');
      return;
    }
    searchResults.innerHTML = matches.map(function(u){
      var owners = ownerNames(u) || 'No owner on file';
      var badge = u.o.length>1 ? '<span class="multi-badge">'+u.o.length+'</span>' : '';
      return '<div class="sr-item" data-id="'+u.id+'"><span class="sr-villa">'+u.v+'</span>'+
             '<span class="sr-owner">'+escapeHtml(owners)+'</span>'+badge+'</div>';
    }).join('');
    searchResults.classList.add('show');
  }

  searchResults.addEventListener('click', function(e){
    var item = e.target.closest('.sr-item');
    if(!item) return;
    var id = item.dataset.id;
    searchResults.classList.remove('show');
    searchBox.value = state.units[id].v;
    if(state.view!=='map') switchView('map');
    selectUnit(id, true);
  });

  document.addEventListener('click', function(e){
    if(!e.target.closest('#searchWrap')) searchResults.classList.remove('show');
  });

  // ---------------- list view ----------------
  var listSort = {k:'v', dir:1};

  function buildListView(){
    document.querySelectorAll('#listView th').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.dataset.k;
        if(listSort.k===k) listSort.dir *= -1; else {listSort.k=k; listSort.dir=1;}
        renderListRows();
      });
    });
    renderListRows();
  }

  function renderListRows(){
    var rows = state.activeCluster ? state.list.filter(function(u){return u.c===state.activeCluster;}) : state.list.slice();
    rows.forEach(function(u){
      u.oname = ownerNames(u) || '\u2014';
      u.ophone = ownerPhones(u)[0] || '\u2014';
    });
    rows.sort(function(a,b){
      var av = (a[listSort.k]||'').toString().toLowerCase();
      var bv = (b[listSort.k]||'').toString().toLowerCase();
      if(av<bv) return -1*listSort.dir;
      if(av>bv) return 1*listSort.dir;
      return 0;
    });
    document.getElementById('listCount').textContent = rows.length.toLocaleString()+' units';
    var body = document.getElementById('listBody');
    body.innerHTML = rows.map(function(u){
      var badge = u.o.length>1 ? '<span class="multi-badge">'+u.o.length+' owners</span>' : '';
      return '<tr data-id="'+u.id+'">'+
        '<td><b>'+u.v+'</b></td>'+
        '<td><span class="tag">'+u.c+'</span></td>'+
        '<td>'+escapeHtml(u.oname)+badge+'</td>'+
        '<td>'+escapeHtml(u.ophone)+'</td>'+
        '</tr>';
    }).join('');
  }

  document.getElementById('listBody').addEventListener('click', function(e){
    var tr = e.target.closest('tr');
    if(!tr) return;
    switchView('map');
    selectUnit(tr.dataset.id, true);
  });

  // ---------------- view switching ----------------
  function switchView(v){
    state.view = v;
    document.getElementById('btnMapView').classList.toggle('active', v==='map');
    document.getElementById('btnListView').classList.toggle('active', v==='list');
    document.getElementById('listView').classList.toggle('show', v==='list');
    document.getElementById('main').style.background = v==='map' ? '#dfe6ea' : '#fff';
    document.getElementById('zoomCtl').style.display = v==='map' ? 'flex' : 'none';
    document.getElementById('legend').style.display = v==='map' ? 'block' : 'none';
    viewport.style.display = v==='map' ? 'block' : 'none';
    if(v==='map') setTimeout(fitToScreen, 0);
  }
  document.getElementById('btnMapView').onclick = function(){switchView('map');};
  document.getElementById('btnListView').onclick = function(){switchView('list');};

  function bindEvents(){
    // placeholder for future global bindings
  }

})();
</script>
</body>
</html>
